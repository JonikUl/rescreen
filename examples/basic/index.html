<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>rescreen — тестовая страница</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
        color: #1a1a1a;
      }
      h1 {
        color: red;
      }
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        max-width: 480px;
      }
      .pulse {
        width: 120px;
        height: 120px;
        margin-top: 24px;
        background: #e05038;
        border-radius: 12px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.6;
        }
      }
      .cookie-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 24px;
        background: #222;
        color: #fff;
        animation: slide-in 0.5s ease-out;
      }
      @keyframes slide-in {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h1>Главная страница</h1>
    <div class="card">
      <p>Тестовая страница для tracer bullet'а rescreen. Текст и вёрстка статичны.</p>
    </div>
    <div class="pulse"></div>
    <div class="cookie-banner">Мы используем cookie. Этот баннер замаскирован в конфиге.</div>
  </body>
</html>
