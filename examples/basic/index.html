<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>rescreen — тестовая страница</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
        color: #1a1a1a;
      }
      h1 {
        color: red;
      }
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        max-width: 480px;
      }
      .pulse {
        width: 120px;
        height: 120px;
        margin-top: 24px;
        background: #e05038;
        border-radius: 12px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.15);
          opacity: 0.6;
        }
      }
      .cookie-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 24px;
        background: #222;
        color: #fff;
        animation: slide-in 0.5s ease-out;
      }
      @keyframes slide-in {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .slider {
        width: 320px;
        margin-top: 24px;
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
      }
      .slide {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
      }
      .slide[hidden] {
        display: none;
      }
      .live-clock {
        width: 320px;
        height: 48px;
        margin-top: 24px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #eef3ff;
        border-radius: 8px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>Главная страница</h1>
    <div class="card">
      <p>Тестовая страница для tracer bullet'а rescreen. Текст и вёрстка статичны.</p>
    </div>
    <div class="pulse"></div>
    <div class="slider">
      <div class="slide">Слайд 1</div>
      <div class="slide" hidden>Слайд 2</div>
      <div class="slide" hidden>Слайд 3</div>
    </div>
    <script>
      // JS-слайдер с autoplay: прокручивает слайды, затем останавливается.
      // Capture дожидается стабильного кадра — остановку слайдера.
      const slides = document.querySelectorAll(".slider .slide");
      let step = 0;
      const timer = setInterval(() => {
        step += 1;
        slides.forEach((slide, i) => {
          slide.hidden = i !== step % slides.length;
        });
        if (step >= 5) clearInterval(timer);
      }, 400);
    </script>
    <div class="live-clock"></div>
    <script>
      // Живые часы: классический флейкующий блок.
      // Замаскирован per-page в rescreen.config.ts (маска .live-clock на home).
      const clock = document.querySelector(".live-clock");
      const tick = () => {
        clock.textContent = "Сейчас: " + new Date().toLocaleTimeString("ru-RU");
      };
      tick();
      setInterval(tick, 1000);
    </script>
    <div class="cookie-banner">Мы используем cookie. Этот баннер замаскирован в конфиге.</div>
  </body>
</html>
